<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SmartThings AI 루틴 어시스턴트 데모 V3</title>
<style>
/*FONTFACE*/
:root{
  --bg:#f3f3f5; --surface:#fcfcff; --ink:#010102; --mute:#848487; --blue:#2e65d4; --primary:#387aff;
  --line:#e4e4e7; --tint:rgba(4,8,12,.04); --tone:rgba(24,26,23,.05);
  --ease:cubic-bezier(.22,.8,.2,1); --ease-io:cubic-bezier(.45,0,.15,1);
  --sq:1; --s:1;
  --stage:#0e0f12; --p-ink:#f2f3f5; --p-mute:#9a9da6; --p-line:rgba(255,255,255,.09); --p-card:rgba(255,255,255,.045);
}
/* iOS 스타일 연속 곡률(G2) 스쿼클: 지원 브라우저에서 모든 라운드 모서리에 적용 */
@supports (corner-shape: squircle){
  :root{--sq:1.3}
  .sq{corner-shape:squircle}
}
#device,#device *{--sq:1;corner-shape:round}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--stage);color:var(--p-ink);font-family:'One UI Sans GUI',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-weight:400;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block;-webkit-user-drag:none}

/* ───────── Stage ───────── */
#stage{height:100%;display:flex;align-items:center;justify-content:center;gap:clamp(28px,5vw,84px);padding:20px clamp(20px,4vw,56px)}
#phoneWrap{flex:none;width:calc(384px*var(--s));height:calc(804px*var(--s));position:relative}
#device{position:absolute;left:0;top:0;width:384px;height:804px;padding:12px;background:#050506;border-radius:calc(40px*var(--sq));transform:scale(var(--s));transform-origin:0 0;box-shadow:0 40px 80px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.06)}
#phone{position:relative;width:360px;height:780px;background:var(--bg);border-radius:calc(30px*var(--sq));overflow:hidden;color:var(--ink);cursor:default;isolation:isolate}

/* ───────── Phone: content ───────── */
#content{position:absolute;left:0;right:0;top:88px;padding:0 10px 20px;display:flex;flex-direction:column;gap:20px;transition:transform .7s var(--ease-io);will-change:transform}
.rg{position:relative;background-color:var(--surface);transition:background-color .4s;border-radius:calc(26px*var(--sq));overflow:hidden;flex:none}
.hd{height:42px;padding:6px 18px 4px;display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:17px;line-height:23px}
.hd.then{height:36px;padding:0 18px 4px}
#r2{margin-top:-10px}
.rg.unfocus{background-color:#e8e9ec}
.lbl{transition:opacity .45s}
.lbl.hid{opacity:0}
#r2 .lbl .mn{opacity:.4}
.lbl{display:flex;align-items:center;gap:4px;font-weight:400;font-size:12px;line-height:16px;color:var(--mute);margin-right:-0px}
.zone{padding:0 10px;display:flex;flex-direction:column;align-items:center}
.zone.then.filled{padding-bottom:10px}
.blk{position:relative;width:100%;background:var(--tint);border-radius:calc(16px*var(--sq));overflow:hidden;flex:none}
.add{height:52px;display:flex;align-items:center;gap:6px;padding:10px;margin-bottom:10px;font-size:14px;line-height:19px;transition:opacity .35s}
.add>*{transition:opacity .35s}
.rg.busy .add>*{opacity:.42}
.i32{width:32px;height:32px;flex:none}
.tabs{display:flex;padding:4px}
.tab{flex:1;padding:6px;border-radius:calc(12px*var(--sq));font-size:12px;line-height:16px;text-align:center;opacity:.4}
.tab.on{background:var(--surface);opacity:1}
.row{display:flex;gap:6px;align-items:flex-start;padding:10px}
.row.ctr{align-items:center}
.row>.i32{margin:2px 0}
.row.ctr>.i32{margin:0}
.tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.t{font-size:14px;line-height:19px}
.d{font-size:12px;line-height:16px;color:var(--blue)}
.ed{display:flex;gap:4px;align-items:center;padding:2px 0;flex:none}
.mn{transition:opacity .4s}
#phone.saving .mn{opacity:.4}
.re{width:32px;height:32px;display:grid;place-items:center;transition:opacity .4s}
.re img{width:20px;height:20px}
.re.off{opacity:.4}
.dv{height:1px;margin:0 10px;background:var(--line)}
.arr{width:22px;height:16px;flex:none}
.conn{width:320px;height:38px;flex:none;position:relative}
.aichip{position:absolute;right:0;top:6px;height:32px;border-radius:99px;padding:0 10px 0 8px;display:flex;align-items:center;gap:4px;font-size:12px;line-height:16px;white-space:nowrap;cursor:pointer;
  background:linear-gradient(90deg,rgba(56,242,255,.1) 37%,rgba(56,122,255,.1) 74%),linear-gradient(rgba(4,8,12,.04),rgba(4,8,12,.04));animation:chipin .6s var(--ease) both;animation-delay:calc(var(--i,0)*140ms);transition:opacity .35s,transform .15s}
.aichip img{width:18px;height:18px}
.aichip:active{transform:scale(.95)}
.aichip.out{animation:chipout .35s ease forwards;pointer-events:none}
@keyframes chipout{to{opacity:0;transform:scale(.9)}}
@keyframes chipin{from{opacity:0;transform:translateX(10px) scale(.9)}to{opacity:1;transform:none}}
.addroutine{background:var(--surface);height:52px;border-radius:calc(26px*var(--sq));display:flex;align-items:center;gap:6px;padding:0 18px;font-size:14px;line-height:19px;flex:none;transition:opacity .4s}
#reco{display:flex;flex-direction:column;gap:4px;transition:opacity .4s}
.sub{padding:4px 18px;font-size:12px;line-height:16px;font-weight:600;color:var(--mute)}
.recocard{background:var(--surface);border-radius:calc(26px*var(--sq));padding:16px 18px;display:flex;flex-direction:column;gap:16px}
.reco-i{display:flex;flex-direction:column;gap:6px}
.chips{display:flex;gap:6px}
.chip{background:var(--tint);border-radius:99px;padding:4px 16px 4px 8px;display:flex;align-items:center;gap:4px;font-size:12px;line-height:16px;font-weight:600}
.chip img{width:24px;height:24px}
.hline{height:1px;background:var(--line)}
.fade-out{opacity:0;pointer-events:none}
#reco.fade-out,.addroutine.fade-out{visibility:hidden;transition:opacity .3s,visibility 0s .3s}
#reco.gone{display:none}

/* reveal */
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.rv{animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0)*95ms)}

/* shimmer: 카드 전체 */
.shim{position:absolute;inset:0;overflow:hidden;pointer-events:none;opacity:0;transition:opacity .45s}
.shim::before{content:"";position:absolute;top:0;bottom:0;left:0;width:733px;background:linear-gradient(90deg,rgba(252,252,255,.04) 0%,rgba(56,242,255,.1) 37%,rgba(56,122,255,.1) 62%,rgba(252,252,255,.04) 100%);animation:sweep 1.9s linear infinite}
.rg.busy>.shim,.blk.hl>.shim,.addroutine.busy>.shim{opacity:1}
.rg.paused>.shim::before{animation-play-state:paused}
@keyframes sweep{from{transform:translateX(-733px)}to{transform:translateX(360px)}}
.addroutine{position:relative;overflow:hidden}

/* ───────── Phone: top ───────── */
#status{position:absolute;left:0;top:0;height:24px;padding:0 24px;display:flex;align-items:center;font-size:15px;line-height:20px;opacity:.6;z-index:14;pointer-events:none}
#top{position:absolute;left:0;right:0;top:0;height:88px;z-index:5;pointer-events:none}
#top::before,#top::after{content:"";position:absolute;inset:0}
#top::before{background:linear-gradient(#f3f3f5 0%,#f3f3f5 30%,rgba(243,243,245,0) 100%);height:104px;bottom:auto}
#top::after{background:var(--bg);transition:opacity .45s}
#phone.float #top::after{opacity:0}
#title{position:absolute;left:28px;top:28px;height:60px;display:flex;align-items:center;font-weight:700;font-size:20px;line-height:27px;z-index:1;transition:opacity .35s,transform .45s var(--ease)}
#phone.float #title{opacity:0;transform:translateY(-8px)}
#actions{position:absolute;right:12px;top:34px;height:48px;padding:0 12px 0 16px;display:flex;align-items:center;gap:16px;font-weight:600;font-size:17px;line-height:23px;z-index:1;transform:translateX(-4px);transition:transform .45s var(--ease);pointer-events:auto}
#phone.float #actions{transform:none}
#pill{position:absolute;inset:0;border-radius:999px;border:1px solid rgba(255,255,255,.7);background:rgba(246,246,248,.78);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);box-shadow:0 2.5px 12px rgba(0,0,0,.14),0 0 4px rgba(0,0,0,.04);opacity:0;transform:scale(.92);transition:opacity .4s,transform .5s var(--ease)}
#phone.float #pill{opacity:1;transform:none}
#actions>span{position:relative;height:40px;display:flex;align-items:center}
#btnSave{transition:opacity .3s,color .3s;min-width:40px;justify-content:center}
#phone:not(.canSave) #btnSave{opacity:.4}
#btnSave b{font-weight:600;transition:opacity .25s,transform .35s var(--ease)}
#phone.saving #btnSave b{opacity:0;transform:scale(.6)}
#spin{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;opacity:0;transform:scale(.5);transition:opacity .3s,transform .4s var(--ease)}
#phone.saving #spin{opacity:1;transform:none}
#spin i{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 90deg,rgba(56,122,255,.6) 7%,rgba(60,185,162,.9) 20%,rgba(61,204,135,.9) 38%,rgba(56,122,255,.9) 58%,rgba(59,163,195,.6) 85%,rgba(61,204,135,.6) 96%,rgba(56,122,255,.6) 107%);
  -webkit-mask:radial-gradient(circle 2.75px at 2.75px 11px,#000 98%,transparent),radial-gradient(circle 2.75px at 11px 19.25px,#000 98%,transparent),radial-gradient(circle 2.75px at 19.25px 11px,#000 98%,transparent),radial-gradient(circle 2.75px at 11px 2.75px,#000 98%,transparent);
  mask:radial-gradient(circle 2.75px at 2.75px 11px,#000 98%,transparent),radial-gradient(circle 2.75px at 11px 19.25px,#000 98%,transparent),radial-gradient(circle 2.75px at 19.25px 11px,#000 98%,transparent),radial-gradient(circle 2.75px at 11px 2.75px,#000 98%,transparent);
  animation:spin 1.1s cubic-bezier(.5,.1,.5,.9) infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ───────── Phone: keyboard / nav ───────── */
#kb{position:absolute;left:0;top:476px;width:360px;height:256px;background:#e1e1e5;z-index:6;transform:translateY(304px);transition:transform .46s var(--ease);padding:7px 8px 0}
#phone.kb #kb{transform:none}
.kr{display:flex;justify-content:center;gap:6px;margin-bottom:12px}
.kr.n{margin-bottom:12px}
.k{width:29px;height:38px;border-radius:calc(6px*var(--sq));background:#fbfbfd;display:grid;place-items:center;font-size:19px;line-height:1;font-weight:400;color:#111;box-shadow:0 1px 0 rgba(0,0,0,.12);transition:background .12s,transform .12s;flex:none}
.kr.n .k{height:32px;font-size:19px}
.k.fn{background:#c6c6cb;font-size:13px;font-weight:600}
.k.w41{width:41px}.k.w46{width:46px}.k.sp{width:168px;font-size:11px;color:#333}
.k.go{color:var(--primary);font-size:14px}
.k.hit{background:#cfd9f5;transform:scale(1.12)}
.k.fn.hit{background:#aeb6cc}
.k svg{width:20px;height:20px}
.gapL{margin-left:5.5px}.gapR{margin-right:5.5px}
#nav{position:absolute;left:0;bottom:0;width:360px;height:48px;z-index:7;background:var(--bg)}
#dim{position:absolute;inset:0;z-index:8;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .45s}
#phone.hist #dim{opacity:1}

/* ───────── Phone: AI bar ───────── */
#bottom{position:absolute;left:0;right:0;bottom:48px;padding:10px;z-index:9;background:linear-gradient(rgba(243,243,245,0) 0%,#f3f3f5 50%);transition:transform .46s var(--ease);pointer-events:none}
#phone.hist #bottom{background:none}
#phone.kb #bottom{transform:translateY(-256px)}
#ai{position:relative;border-radius:calc(30px*var(--sq));background:rgba(252,252,255,.94);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);box-shadow:0 12.5px 16px rgba(0,0,0,.1),0 0 8px rgba(0,0,0,.04);padding:12px;pointer-events:auto}
.fold{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .55s var(--ease),opacity .3s}
.fold.open{grid-template-rows:1fr;opacity:1;transition:grid-template-rows .55s var(--ease),opacity .45s .12s}
.fold>div{min-height:0;overflow:hidden}
.mc{background:var(--tint);border-radius:calc(16px*var(--sq));padding:16px;margin-bottom:19px;font-size:14px;line-height:19px}
.mc p{white-space:pre-line}
.mb{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.mb button{height:36px;border-radius:999px;font-weight:600;font-size:15px;line-height:20px;padding:8px 16px;transition:transform .15s,filter .15s}
.mb button:active{transform:scale(.95)}
.mb .sec{background:rgba(4,8,12,.08);padding:8px 12px;width:72px}
.mb .pri{background:var(--primary);color:#fcfcff}
.cd{align-self:center;min-width:12px;margin-right:2px;text-align:center;font-weight:600;font-size:15px;line-height:20px;color:var(--mute);font-variant-numeric:tabular-nums}
.cd.tick{animation:cdtick .45s var(--ease)}
@keyframes cdtick{from{opacity:0;transform:translateY(-6px) scale(1.25)}to{opacity:1;transform:none}}
.hl-list{max-height:574px;overflow-y:auto;display:flex;flex-direction:column;gap:20px;padding-bottom:20px;scrollbar-width:none;font-size:14px;line-height:19px}
.hl-list::-webkit-scrollbar{display:none}
.bub{background:var(--tint);border-radius:calc(16px*var(--sq));padding:16px;opacity:0;transform:translateY(10px);transition:opacity .4s,transform .5s var(--ease);transition-delay:calc(var(--i)*55ms + 120ms)}
#hist.open .bub{opacity:1;transform:none}
.bub.me{align-self:flex-end;color:var(--mute)}
.bub p{white-space:pre-line}
.bub .tag{color:var(--mute);text-align:right;margin-top:12px}
.grp{display:flex;flex-direction:column;gap:4px}
#row{display:flex;align-items:center;height:36px}
.rb{position:relative;width:36px;height:36px;flex:none;transition:width .42s var(--ease),opacity .28s,transform .42s var(--ease),margin .42s var(--ease)}
.rb img{position:absolute;left:0;top:0;width:36px;height:36px;transition:opacity .28s,transform .35s var(--ease)}
#hbtn{width:0;opacity:0;transform:scale(.5)}
#phone.hasHist #hbtn{width:36px;opacity:1;transform:none}
#hbtn .on{opacity:0}
#phone.hist #hbtn .on{opacity:1}
#phone.hist #hbtn .off{opacity:0}
#mic{transform-origin:center}
#phone.noMic #mic{width:0;opacity:0;transform:scale(.5)}
#act{width:0;opacity:0;transform:scale(.5);margin-left:0}
#phone.act #act{width:36px;opacity:1;transform:none;margin-left:8px}
#phone.noMic.act #act{margin-left:0}
#act .stop{opacity:0;transform:scale(.6) rotate(-90deg)}
#phone.stop #act .stop{opacity:1;transform:none}
#phone.stop #act .send{opacity:0;transform:scale(.6) rotate(90deg)}
#field{flex:1;min-width:0;height:36px;position:relative;font-size:14px;line-height:19px;white-space:nowrap;overflow:hidden}
#field>span{position:absolute;left:12px;top:8.5px;transition:opacity .28s,transform .4s var(--ease)}
#ph{color:var(--mute)}
#typed{color:var(--ink);opacity:0}
#st{opacity:0;transform:translateY(6px);background:linear-gradient(90deg,#848487 0%,#848487 38%,#d9dbe6 50%,#848487 62%,#848487 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:tsh 1.6s linear infinite}
@keyframes tsh{from{background-position:130% 0}to{background-position:-30% 0}}
#phone[data-f="typed"] #ph,#phone[data-f="st"] #ph{opacity:0}
#phone[data-f="typed"] #typed{opacity:1}
#phone[data-f="st"] #st{opacity:1;transform:none}
#phone[data-f="st"] #typed{opacity:0;transform:translateY(-6px)}
#cur{display:inline-block;width:2px;height:19px;background:var(--primary);vertical-align:top;border-radius:1px;margin-left:1px;opacity:0}
#phone.kb #cur{animation:blink 1.05s steps(1) infinite}
@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}

/* ───────── Phone: done screen ───────── */
#done{position:absolute;left:0;top:0;width:360px;bottom:48px;background:var(--bg);z-index:12;transform:translateX(100%);transition:transform .62s var(--ease-io);box-shadow:-18px 0 40px rgba(0,0,0,0)}
#phone.done #done{transform:none;box-shadow:-18px 0 40px rgba(0,0,0,.08)}
#done .ab{position:absolute;left:0;right:0;top:28px;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-weight:700;font-size:20px;line-height:27px}
#btnDone{font-weight:600;font-size:17px;line-height:23px;height:40px;display:flex;align-items:center}
#dbody{position:absolute;left:0;right:0;top:88px;bottom:0;overflow-y:auto;padding:10px 10px 30px;display:flex;flex-direction:column;align-items:center;gap:20px;scrollbar-width:none;-webkit-mask-image:linear-gradient(#000 0,#000 78%,transparent 100%);mask-image:linear-gradient(#000 0,#000 78%,transparent 100%)}
#dbody::-webkit-scrollbar{display:none}
.dtop{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px}
.dicon{position:relative;background:var(--surface);border-radius:46px;padding:8px}
.dicon>img{width:56px;height:56px}
.dicon span{position:absolute;right:-4px;top:-4px;width:28px;height:28px;border-radius:50%;background:linear-gradient(var(--tone),var(--tone)),#f3f3f5;display:grid;place-items:center}
.dicon span img{width:20px;height:20px}
.dname{width:100%;background:var(--surface);border-radius:calc(26px*var(--sq));padding:20px;display:flex;align-items:center;font-weight:600;font-size:17px;line-height:26px}
.dname b{flex:1;font-weight:600}
.dname img{width:24px;height:24px}
.dcat{width:340px;background:var(--surface);border-radius:calc(26px*var(--sq));padding:12px 18px;min-height:52px;display:flex;flex-direction:column;gap:1px;justify-content:center;font-size:17px;line-height:23px}
.dcat small{font-size:12px;line-height:16px;color:var(--blue)}
.dsum{width:340px;background:var(--surface);border-radius:calc(26px*var(--sq));padding:18px;display:flex;flex-direction:column;gap:20px;font-size:14px;line-height:19px}
.dsum small{display:block;font-size:12px;line-height:16px;color:var(--mute)}
.dsum h4{font-size:17px;line-height:23px;font-weight:600;padding-bottom:4px}
.dsum h4.th{padding-top:12px}
.dsum ul{list-style:disc;padding-left:21px}
.dsum hr{border:0;height:1px;background:#d7d7da}
#phone.done .dstag{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i)*90ms + 280ms)}

/* ───────── AI 제안 다이얼로그 ───────── */
#dlgDim{position:absolute;inset:0;z-index:15;background:rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .35s}
#dlg{position:absolute;left:10px;bottom:64px;width:340px;z-index:16;border-radius:26px;background:rgba(244,244,246,.9);-webkit-backdrop-filter:blur(27px);backdrop-filter:blur(27px);border:1px solid rgba(255,255,255,.7);box-shadow:0 8px 20px rgba(0,0,0,.14),0 0 8px rgba(0,0,0,.04);padding-top:24px;opacity:0;transform:translateY(28px) scale(.97);pointer-events:none;transition:opacity .28s,transform .45s var(--ease);overflow:hidden}
#phone.dlg #dlgDim{opacity:1;pointer-events:auto}
#phone.dlg #dlg{opacity:1;transform:none;pointer-events:auto}
#dlg h3{font-size:17px;line-height:23px;font-weight:600;padding:0 24px 12px}
#dlg p{font-size:14px;line-height:21px;color:#252528;padding:0 24px}
.dchips{display:flex;gap:4px;padding:8px 20px;overflow-x:auto;scrollbar-width:none}
.dchips::-webkit-scrollbar{display:none}
.dchips:empty{display:none}
.dchips span{flex:none;height:32px;border-radius:99px;background:var(--tint);padding:0 12px;display:flex;align-items:center;font-size:12px;line-height:16px;white-space:nowrap}
.dbot{display:flex;align-items:center;padding:16px 24px 20px;height:72px}
.dbtn{flex:1;height:40px;border-radius:999px;font-weight:600;font-size:17px;line-height:23px;color:var(--ink);margin:0 12px;transition:background .15s}
.dbtn:active{background:rgba(4,8,12,.06)}
.dbot i{width:1px;height:16px;background:rgba(132,132,135,.23);flex:none}
#phone.free{touch-action:none}
#phone.free .rg{cursor:pointer}
#shint{position:absolute;left:50%;top:104px;transform:translate(-50%,-6px);z-index:31;pointer-events:none;background:rgba(1,1,2,.74);color:#fff;font-size:12px;line-height:16px;font-weight:600;padding:7px 12px 7px 9px;border-radius:99px;display:flex;align-items:center;gap:6px;opacity:0;transition:opacity .35s,transform .45s var(--ease);white-space:nowrap}
#shint.on{opacity:1;transform:translate(-50%,0)}
#shint b{display:inline-block;animation:updn 1.2s ease-in-out infinite;font-weight:700}
@keyframes updn{0%,100%{transform:translateY(-2px)}50%{transform:translateY(2px)}}
body.nohint #shint{display:none}

/* ───────── Touch hint ───────── */
#hint{position:absolute;left:0;top:0;width:46px;height:46px;margin:-23px 0 0 -23px;z-index:30;pointer-events:none;opacity:0;transition:opacity .3s}
#hint.on{opacity:1}
#hint i{position:absolute;inset:7px;border-radius:50%;background:rgba(56,122,255,.13);box-shadow:inset 0 0 0 1.5px rgba(56,122,255,.95),0 0 0 1.5px rgba(255,255,255,.75),0 4px 16px rgba(56,122,255,.4);animation:dot 1.5s ease-in-out infinite}
#hint::before,#hint::after{content:"";position:absolute;inset:8px;border-radius:50%;border:2px solid rgba(56,122,255,.75);animation:ring 1.5s cubic-bezier(.2,.6,.3,1) infinite}
#hint::after{animation-delay:.5s}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(2.3);opacity:0}}
@keyframes dot{0%,100%{transform:scale(1)}50%{transform:scale(.86)}}
#hint.nudge i{animation:nudge .45s var(--ease)}
@keyframes nudge{0%{transform:scale(1)}40%{transform:scale(1.55)}100%{transform:scale(1)}}
body.nohint #hint{display:none}
.rip{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(56,122,255,.22);z-index:31;pointer-events:none;animation:rip .55s ease-out forwards}
@keyframes rip{from{transform:scale(.3);opacity:1}to{transform:scale(1.5);opacity:0}}
.tapTarget{cursor:pointer}

/* 즉시 적용(단계 이동) 모드 */
#phone.instant,#phone.instant *,#phone.instant *::before,#phone.instant *::after{transition:none!important}
#phone.instant .rv,#phone.instant .dstag,#phone.instant .aichip{animation:none!important}

/* ───────── Side panel ───────── */
#panel{flex:0 1 420px;min-width:320px;max-height:100%;display:flex;flex-direction:column;gap:18px;transition:opacity .3s}
body.nopanel #panel{display:none}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--p-mute);font-weight:600}
.ver{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:99px;background:#387aff;color:#fff;letter-spacing:.04em}
#panel h1{font-size:clamp(24px,2.3vw,32px);line-height:1.22;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.lead{font-size:14px;line-height:1.6;color:var(--p-mute);margin-top:-8px}
.prog{display:flex;align-items:center;gap:12px}
.prog b{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--p-ink);white-space:nowrap}
.prog b span{color:var(--p-mute);font-weight:400}
.segs{flex:1;display:flex;gap:4px}
.segs i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.14);transition:background .4s}
.segs i.on{background:#6ea0ff}
.segs i.cur{background:#fff}
.pcard{background:var(--p-card);border:1px solid var(--p-line);border-radius:calc(20px*var(--sq));padding:20px 22px;display:flex;flex-direction:column;gap:14px;min-height:292px}
.todo{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:#9fc0ff;min-height:24px}
.todo .pd{position:relative;width:12px;height:12px;border-radius:50%;background:#6ea0ff;flex:none}
.todo .pd::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #6ea0ff;animation:ring 1.5s cubic-bezier(.2,.6,.3,1) infinite}
.todo.run{color:var(--p-mute)}
.todo.run .pd{background:var(--p-mute)}
.todo.run .pd::after{display:none}
#pTitle{font-size:21px;line-height:1.3;font-weight:700}
#pBody{font-size:14.5px;line-height:1.65;color:#d2d4da}
.pt{margin-top:auto;padding-top:14px;border-top:1px solid var(--p-line);font-size:13.5px;line-height:1.6;color:#d2d4da}
.pt b{display:block;font-size:11.5px;letter-spacing:.08em;color:#6ea0ff;font-weight:600;margin-bottom:4px}
.swap{animation:swap .45s var(--ease) both}
@keyframes swap{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--p-card);border:1px solid var(--p-line);border-radius:calc(16px*var(--sq));padding:12px 14px}
.stat b{display:block;font-size:24px;line-height:1.15;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--p-mute);line-height:1.35;display:block;margin-top:2px}
.stat.ai b{color:#8fe0b3}
.ctrl{display:flex;gap:8px;flex-wrap:wrap}
.ctrl button{height:38px;padding:0 14px;border-radius:calc(12px*var(--sq));background:rgba(255,255,255,.07);border:1px solid var(--p-line);font-size:13px;font-weight:600;color:var(--p-ink);transition:background .2s,opacity .2s}
.ctrl button:hover{background:rgba(255,255,255,.13)}
.ctrl button:disabled{opacity:.35;cursor:default}
.ctrl button.pri{background:#387aff;border-color:#387aff}
.ctrl button.pri:hover{background:#4c88ff}
.ctrl button:focus-visible{outline:2px solid #9fc0ff;outline-offset:2px}
.keys{font-size:12px;color:var(--p-mute);line-height:1.7}
.keys kbd{font:inherit;font-size:11px;padding:1px 6px;border:1px solid var(--p-line);border-radius:5px;color:var(--p-ink);margin-right:3px}
#showPanel{position:fixed;right:16px;top:16px;display:none;height:34px;padding:0 12px;border-radius:calc(10px*var(--sq));background:rgba(255,255,255,.08);border:1px solid var(--p-line);font-size:12px;font-weight:600;color:var(--p-mute)}
body.nopanel #showPanel{display:block;opacity:.0;transition:opacity .2s}
body.nopanel #showPanel:hover,body.nopanel #showPanel:focus-visible{opacity:1}
@media (max-width:860px){
  body{overflow:auto}
  #stage{flex-direction:column;height:auto;min-height:100%;padding:16px}
  #panel{flex:none;width:100%;max-width:420px;min-width:0}
  .keys{display:none}
}
@media (prefers-reduced-motion:reduce){
  .shim::before,#st,#hint::before,#hint::after,#hint i{animation-duration:3s}
}

<body>
<div id="stage">
  <div id="phoneWrap"><div id="device" class="sq"><div id="phone" class="sq" data-f="ph"></div></div></div>

  <aside id="panel" aria-live="polite">
    <div class="eyebrow">SMARTTHINGS · AI ROUTINE ASSISTANT <span class="ver">V3</span></div>
    <h1>말 한마디로 완성하는 자동화 루틴</h1>
    <p class="lead">조건과 동작을 하나씩 고르던 If/Then 빌더를, 문장으로 요청하면 AI가 채워주는 흐름으로 바꾼 시나리오입니다.</p>
    <div class="prog"><b id="pNum">01 <span>/ 11</span></b><div class="segs" id="segs"></div></div>
    <div class="pcard sq">
      <div class="todo" id="pTodo"><span class="pd"></span><span id="pTap"></span></div>
      <div id="pTitle"></div>
      <div id="pBody"></div>
      <div class="pt"><b>UX POINT</b><span id="pPoint"></span></div>
    </div>
    <div class="stats">
      <div class="stat sq"><b id="sSent">0</b><span>입력한 문장</span></div>
      <div class="stat sq"><b id="sTap">0</b><span>사용자 터치</span></div>
      <div class="stat ai sq"><b id="sAi">0</b><span>AI가 구성한 조건·동작</span></div>
    </div>
    <div class="ctrl">

      <button id="cNext" class="sq pri">다음 단계 →</button>

      <button id="cHint" class="sq">터치 힌트 끄기</button>
    </div>
    <div class="keys"><kbd>Space</kbd><kbd>→</kbd>다음 단계 &nbsp; <kbd>←</kbd>이전 &nbsp; <kbd>R</kbd>처음부터 &nbsp; <kbd>H</kbd>패널 숨기기 &nbsp; <kbd>G</kbd>힌트</div>
  </aside>
</div>
<button id="showPanel" class="sq">설명 패널 보기 (H)</button>

<script>
const SVG=/*ICONS*/;
const U={};for(const k in SVG)U[k]='data:image/svg+xml;utf8,'+encodeURIComponent(SVG[k]);
const $=s=>document.querySelector(s);
const phone=$('#phone');

/* ───────── 문구 ───────── */
const TXT={
  ph:'루틴 생성 또는 수정을 도와드릴게요.',
  say1:'퇴근하면 거실 조명 켜줘',
  say2:'출근할 때는 모든 기기 다 꺼줘',
  perm:'집에 도착했을 때를 퇴근으로 판단하기 위해 이 휴대폰 위치 조회를 허용해주세요.',
  done1:'평일 저녁 6시에서 10시 사이에 이 휴대폰이 Home에 도착하면 거실 조명이 켜지도록 설정했어요.',
  sug:'출근할 때는 조명이 꺼지도록 설정할까요?',
  done2:'평일 아침 6시에서 10시 사이에 이 휴대폰이 Home에서 떠나면 거실 조명이 꺼지도록 설정했어요.',
  done3:'출근할 때는 보유 중인 모든 기기를 끄도록 변경했어요.'
};

/* ───────── 템플릿 ───────── */
const img=(n,c='')=>`<img class="${c}" src="${U[n]}" alt="" draggable="false">`;
const row=(icon,title,descs,o={})=>`<div class="row${o.ctr?' ctr':''}">${img(icon,'i32')}<div class="tx"><div class="t">${title}</div>${descs.map(d=>`<div class="d">${d}</div>`).join('')}</div><div class="ed">${img('minus','i32 mn')}${o.re?`<span class="re${o.reOff?' off':''}">${img('reorder')}</span>`:''}</div></div>`;
const blk=(inner,i,id='')=>`<div class="blk sq rv"${id?` id="${id}"`:''} style="--i:${i}">${inner}<div class="shim"></div></div>`;
const arr=i=>`<div class="arr rv" style="--i:${i}">${img('arrow')}</div>`;
const conn=i=>`<div class="conn rv" style="--i:${i}">${img('connector')}</div>`;
const addRow=t=>`<div class="blk sq add">${img('plus','i32')}<span>${t}</span></div>`;
const cardHTML=(id,label,hid)=>`<section class="rg sq" id="${id}">
  <div class="hd"><span>If</span><span class="lbl${hid?' hid':''}">${label}${img('minus','i32 mn')}</span></div>
  <div class="zone if">${addRow('Add condition')}</div>
  <div class="hd then"><span>Then</span></div>
  <div class="zone then">${addRow('Add action')}</div>
  <div class="shim"></div></section>`;
const key=(c,cls='')=>`<span class="k sq ${cls}" data-k="${c}">${c}</span>`;
const kbHTML=()=>{
  const r=(s,cls='')=>`<div class="kr ${cls}">${[...s].map(c=>key(c)).join('')}</div>`;
  const shift='<svg viewBox="0 0 20 20" fill="none" stroke="#111" stroke-width="1.5" stroke-linejoin="round"><path d="M10 3.2 3.6 10h3.2v5.6h6.4V10h3.2z"/></svg>';
  const back='<svg viewBox="0 0 20 20" fill="none" stroke="#111" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M7 4.8h9.2a1.3 1.3 0 0 1 1.3 1.3v7.8a1.3 1.3 0 0 1-1.3 1.3H7L2.5 10z"/><path d="m9.6 8 4 4m0-4-4 4"/></svg>';
  return r('1234567890','n')+r('ㅂㅈㄷㄱㅅㅛㅕㅑㅐㅔ')+r('ㅁㄴㅇㄹㅎㅗㅓㅏㅣ')+
   `<div class="kr"><span class="k sq fn w41 gapR" data-k="shift">${shift}</span>${[...'ㅋㅌㅊㅍㅠㅜㅡ'].map(c=>key(c)).join('')}<span class="k sq fn w41 gapL" data-k="back">${back}</span></div>`+
   `<div class="kr"><span class="k sq fn w46">!#1</span><span class="k sq">,</span><span class="k sq sp" data-k=" ">한국어</span><span class="k sq">.</span><span class="k sq fn w46 go">Go</span></div>`;
};
const histHTML=()=>{
  const me=(t,i)=>`<div class="bub sq me" style="--i:${i}">${t}</div>`;
  const ai=(t,tag,i)=>`<div class="bub sq" style="--i:${i}"><p>${t}</p>${tag?`<div class="tag">${tag}</div>`:''}</div>`;
  return me(TXT.say1,0)+`<div class="grp">${ai(TXT.perm,'허용 함',1)}${ai(TXT.done1+'\n\n'+TXT.sug,'두 번째 루틴 생성',2)}${ai(TXT.done2,'',3)}</div>`+me(TXT.say2,4)+ai(TXT.done3,'',5);
};
const phoneHTML=()=>`
  <div id="content">
    ${cardHTML('r1','첫 번째 루틴',true)}
    <div class="addroutine sq" id="addRoutine">${img('plus','i32')}<span>Add routine</span><div class="shim"></div></div>
    <div id="reco">
      <div class="sub">당신을 위한 추천 루틴</div>
      <div class="recocard sq">
        <div class="reco-i"><div class="t">TV 볼 때 불 끄기</div><div class="chips"><span class="chip">${img('tv_s')}거실 TV</span><span class="chip">${img('bulb_s')}거실 조명</span></div></div>
        <div class="hline"></div>
        <div class="reco-i"><div class="t">집에 도착하면 불 켜기</div><div class="chips"><span class="chip">${img('bulb_s')}거실 조명</span></div></div>
      </div>
    </div>
  </div>
  <div id="top">
    <div id="title">Create routine</div>
    <div id="actions"><div id="pill"></div><span id="btnCancel">Cancel</span><span id="btnSave"><b>Save</b><div id="spin"><i></i></div></span></div>
  </div>
  <div id="kb">${kbHTML()}</div>
  <div id="nav">${img('navbar')}</div>
  <div id="dim"></div>
  <div id="bottom"><div id="ai" class="sq">
    <div id="hist" class="fold"><div><div class="hl-list" id="hlist">${histHTML()}</div></div></div>
    <div id="msg" class="fold"><div><div class="mc sq"><p id="msgText"></p><div class="mb" id="msgBtns"></div></div></div></div>
    <div id="row">
      <span class="rb" id="hbtn">${img('history','off')}${img('history_on','on')}</span>
      <div id="field"><span id="ph">${TXT.ph}</span><span id="typed"><span id="tt"></span><i id="cur"></i></span><span id="st"></span></div>
      <span class="rb" id="mic">${img('mic')}</span>
      <span class="rb" id="act">${img('send','send')}${img('stop','stop')}</span>
    </div>
  </div></div>
  <div id="done">
    <div class="ab"><span>Create routine</span><span id="btnDone">Done</span></div>
    <div id="dbody">
      <div class="dtop">
        <div class="dicon dstag" style="--i:0">${img('building')}<span>${img('pencil')}</span></div>
        <div class="dname sq dstag" style="--i:1"><b>출 퇴근 할 때 기기 켜고 끄기</b>${img('xbtn')}</div>
      </div>
      <div class="dcat sq dstag" style="--i:2">Category<small>Add this routine to a category to make it easy to find.</small></div>
      <div class="dsum sq dstag" style="--i:3">
        <div><small>첫 번째 루틴</small><h4>If</h4><ul><li>평일 오후 6:00 - 오후 10:00</li><li>집에 내가 도착하면</li><li>Living room Light가 꺼져 있으면</li></ul><h4 class="th">Then</h4><ul><li>Living room Light 켜기</li></ul></div>
        <hr>
        <div><small>두 번째 루틴</small><h4>If</h4><ul><li>평일 오전 6:00 - 오전 10:00</li><li>집에서 내가 떠나면</li><li>Living room Light 켜져 있으면</li><li>Living room TV 켜져 있으면</li><li>Bedroom Outlet 켜져 있으면</li></ul><h4 class="th">Then</h4><ul><li>Living room Light 끄기</li><li>Living room TV 끄기</li><li>Bedroom Outlet 끄기</li></ul></div>
      </div>
    </div>
  </div>
  <div id="dlgDim"></div>
  <div id="dlg"><h3 id="dlgT"></h3><p id="dlgB"></p><div class="dchips" id="dlgC"></div><div class="dbot" id="dlgBtns"></div></div>
  <div id="shint"><b>↕</b>화면을 스크롤해 보세요</div>
  <div id="status">12:45</div>
  <div id="hint"><i></i></div>`;

/* ───────── 타임라인 유틸 ───────── */
let INSTANT=false, RUN=0;
const wait=ms=>{ if(INSTANT) return Promise.resolve(); const my=RUN; return new Promise(r=>setTimeout(()=>{ if(my===RUN) r(); },ms)); };
const cls=(c,on)=>phone.classList.toggle(c,on);
const q=s=>phone.querySelector(s);
function morph(el,fn,dur=600){ // 높이 변화를 부드럽게
  const h0=el.offsetHeight; fn(); const h1=el.offsetHeight;
  if(!INSTANT&&h0!==h1) el.animate([{height:h0+'px'},{height:h1+'px'}],{duration:dur,easing:'cubic-bezier(.22,.8,.2,1)'});
  return h1;
}
let scrollY=0, forceFloat=false;
function scrollTo(y){ scrollY=Math.max(0,Math.round(y)); q('#content').style.transform=`translateY(${-scrollY}px)`; cls('float',forceFloat||scrollY>0); }
const field=m=>phone.dataset.f=m;
function busy(text,stop=true){ q('#st').textContent=text; field('st'); cls('hasHist',false); cls('noMic',true); cls('act',stop); cls('stop',stop); }
function idle(){ field('ph'); q('#tt').textContent=''; cls('noMic',false); cls('act',false); cls('stop',false); cls('hasHist',true); }
let cdTimer=null;
function hideReco(){ const my=RUN, r=q('#reco'); if(INSTANT){ r.classList.add('gone'); return; } setTimeout(()=>{ if(my===RUN) r.classList.add('gone'); },340); }
function openMsg(text,btns,count){ clearTimeout(cdTimer); q('#msgText').textContent=text;
  q('#msgBtns').innerHTML=(count?'<span class="cd" id="mCd">3</span>':'')+btns.map(b=>`<button class="${b.pri?'pri':'sec'}" id="${b.id}">${b.t}</button>`).join(''); q('#msg').classList.add('open');
  if(count&&!INSTANT) startCount(); }
function startCount(){ const my=RUN; let n=3;
  const done=()=>{ if(my!==RUN) return; if(STEPS[cur].target==='#mOk'){ if(armed) advance(true); else cdTimer=setTimeout(done,150); } else if(running) cdTimer=setTimeout(done,150); else closeMsg(); };
  const tick=()=>{ if(my!==RUN) return; n--; const e=q('#mCd'); if(!e) return;
    if(n>0){ e.textContent=n; e.classList.remove('tick'); void e.offsetWidth; e.classList.add('tick'); cdTimer=setTimeout(tick,1000); } else done(); };
  cdTimer=setTimeout(tick,1350); }
const closeMsg=()=>{ clearTimeout(cdTimer); q('#msg').classList.remove('open'); };
const stat={sent:0,tap:0,ai:0};
function bump(k,n=1){ stat[k]+=n; renderStats(); }
function renderStats(){ $('#sSent').textContent=stat.sent; $('#sTap').textContent=stat.tap; $('#sAi').textContent=stat.ai; }

/* 한글 두벌식 조합 타이핑 */
const CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ',JUNG='ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ';
const JONG=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const VS={'ㅘ':'ㅗㅏ','ㅙ':'ㅗㅐ','ㅚ':'ㅗㅣ','ㅝ':'ㅜㅓ','ㅞ':'ㅜㅔ','ㅟ':'ㅜㅣ','ㅢ':'ㅡㅣ'};
const DBL={'ㄲ':'ㄱ','ㄸ':'ㄷ','ㅃ':'ㅂ','ㅆ':'ㅅ','ㅉ':'ㅈ'};
const syl=(c,j,t)=>String.fromCharCode(0xAC00+c*588+j*28+t);
function strokes(text){ const out=[]; let done='';
  for(const ch of text){ const code=ch.charCodeAt(0)-0xAC00;
    if(code<0||code>11171){ out.push({s:done+ch,k:ch}); done+=ch; continue; }
    const c=Math.floor(code/588), j=Math.floor(code%588/28), t=code%28; const cj=CHO[c];
    const p=done.charCodeAt(done.length-1)-0xAC00; let first=done+cj;

  let x=(a.left+a.width/2-p.left)/s, y=(a.top+a.height/2-p.top)/s; if(STEPS[cur].target==='#field') x=(a.left-p.left)/s+a.width*.42;
  const h=hint(); h.style.transform=`translate(${x}px,${y}px)`; }
function arm(){ armed=true; running=false; phone.querySelectorAll('.tapTarget').forEach(e=>e.classList.remove('tapTarget'));
  const t=q(STEPS[cur].target); if(t) t.classList.add('tapTarget'); placeHint(); hint().classList.add('on'); if(cur===7||cur===9) enterFree(); renderPanel(false); $('#pTodo').classList.remove('run'); $('#cNext').disabled=false; }
function disarm(){ armed=false; hint().classList.remove('on'); phone.querySelectorAll('.tapTarget').forEach(e=>e.classList.remove('tapTarget')); }
async function advance(auto){ if(!armed||running) return; const my=RUN; exitFree(); disarm(); running=true; if(auto!==true) bump('tap'); $('#pTodo').classList.add('run'); $('#pTap').textContent='화면 전환 중…'; $('#cNext').disabled=true;
  await STEPS[cur].run(); if(my!==RUN) return;
  if(cur===STEPS.length-1){ goTo(0); return; }
  cur++; running=false; renderPanel(true); await wait(120); if(my!==RUN) return; arm(); }
function reset(){ RUN++; INSTANT=false; scrollY=0; forceFloat=false; stat.sent=stat.tap=stat.ai=0; renderStats();
  clearTimeout(cdTimer); phone.className='sq'; phone.dataset.f='ph'; phone.innerHTML=phoneHTML(); armed=false; running=false; free=false; drag=null; focusN=2; }
async function goTo(k){ reset(); const my=RUN; cur=0;
  if(k>0){ INSTANT=true; phone.classList.add('instant');
    for(let i=0;i<k;i++){ stat.tap++; await STEPS[i].run(); if(my!==RUN) return; }
    renderStats(); cur=k; phone.querySelectorAll('.rv').forEach(e=>e.classList.remove('rv')); void phone.offsetWidth; await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r))); if(my!==RUN) return;
    phone.classList.remove('instant'); INSTANT=false; }
  renderPanel(true); await wait(k?250:500); if(my!==RUN) return; arm(); }

/* ───────── 입력 ───────── */
function ripple(x,y){ const r=document.createElement('span'); r.className='rip'; r.style.left=x+'px'; r.style.top=y+'px'; phone.appendChild(r); setTimeout(()=>r.remove(),600); }
phone.addEventListener('click',e=>{
  const p=phone.getBoundingClientRect(), s=p.width/360, x=(e.clientX-p.left)/s, y=(e.clientY-p.top)/s; ripple(x,y);
  if(moved){ moved=false; return; }
  if(phone.classList.contains('dlg')){ if(e.target.closest('.dbtn')||!e.target.closest('#dlg')) closeDialog(); return; }
  if(e.target.closest('#mOk')&&STEPS[cur].target!=='#mOk'&&q('#mCd')){ closeMsg(); return; }
  if(!armed) return; const t=q(STEPS[cur].target); if(!t) return; const a=t.getBoundingClientRect();
  const pad=10*s; const inside=e.clientX>=a.left-pad&&e.clientX<=a.right+pad&&e.clientY>=a.top-pad&&e.clientY<=a.bottom+pad;
  if(inside){ advance(false); return; }
  if(free&&!e.target.closest('#bottom')){ const chip=e.target.closest('.aichip'); if(chip){ openDialog(chip.dataset.d); return; }
    const card=e.target.closest('.rg'); if(card){ if((card.id==='r1'?1:2)!==focusN) setFocus(card.id==='r1'?1:2,true); return; } }
  const h=hint(); h.classList.remove('nudge'); void h.offsetWidth; h.classList.add('nudge');
});
$('#cNext').onclick=()=>advance(false);
$('#cPrev').onclick=()=>{ if(cur>0||running) goTo(Math.max(0,running?cur:cur-1)); };
$('#cReset').onclick=()=>goTo(0);
const toggleHint=()=>{ const off=document.body.classList.toggle('nohint'); $('#cHint').textContent=off?'터치 힌트 켜기':'터치 힌트 끄기'; };
$('#cHint').onclick=toggleHint;
const togglePanel=()=>{ document.body.classList.toggle('nopanel'); fit(); };
$('#showPanel').onclick=togglePanel;
addEventListener('keydown',e=>{ if(e.metaKey||e.ctrlKey||e.altKey) return; const k=e.key.toLowerCase();
  if(k===' '||k==='arrowright'||k==='enter'){ e.preventDefault(); advance(false); }
  else if(k==='arrowleft'){ e.preventDefault(); $('#cPrev').click(); }
  else if(k==='r') goTo(0); else if(k==='h') togglePanel(); else if(k==='g') toggleHint(); });

/* ───────── 화면 맞춤 ───────── */
function fit(){ const narrow=innerWidth<=860, panelOn=!document.body.classList.contains('nopanel');
  const availH=(narrow?Math.max(innerHeight*.9,560):innerHeight)-40;
  const availW=narrow?innerWidth-32:innerWidth-(panelOn?Math.min(420,innerWidth*.36)+140:80);
  const s=Math.max(.45,Math.min(availH/804,availW/384,1.5)); document.documentElement.style.setProperty('--s',s.toFixed(4)); if(armed) placeHint(); }
addEventListener('resize',fit); fit();
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{ const m=/[#&]step=(\d+)/.exec(location.hash); goTo(m?Math.min(STEPS.length-1,Math.max(0,+m[1]-1)):0); });
</script>
</body>
